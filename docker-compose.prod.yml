name: deevalegh-prod

# Shared by every service built from this repo. Previously duplicated four
# times, which is how the copies drift.
x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/deevalegh
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  S3_ENDPOINT_URL: http://minio:9000
  FLASK_ENV: production

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: deevalegh
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # -d deevalegh: without it pg_isready probes a database named after the
      # user, which does not exist, and postgres logs a FATAL every interval.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d deevalegh"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    # --console-address pins the console to a fixed port. Without it MinIO binds
    # the console to a RANDOM free port on every start, and -- combined with the
    # browser redirect below -- a presigned download opened in a browser was
    # being 307-redirected to files.deevalegh.com:<random>, which nothing
    # exposes, so it timed out. The console is not published to the host at all
    # (no ports: entry), so :9001 is internal-only.
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set in .env}
      # Presigned uploads/downloads are cross-origin (frontend -> files.domain).
      # The presigned signature is the real authorisation, so allowing any
      # origin to attempt the request is safe. Avoids browser CORS failures.
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
      # Serve the S3 API to browsers directly. By default MinIO redirects any
      # browser request on the API port to the console UI; for a presigned
      # object URL opened in a tab that redirect is exactly wrong -- we want the
      # bytes, not the console. Turning the redirect off makes files.deevalegh.com
      # return the object.
      MINIO_BROWSER_REDIRECT: "false"
    networks:
      default:
      proxy:
        aliases:
          - deevalegh-minio
    volumes:
      - minio_data:/data

  # Runs once per deploy and exits; everything that touches the database waits
  # for it to succeed. If a migration fails, the app never starts on a schema it
  # cannot use -- which is the failure mode you want.
  migrate:
    build: .
    restart: "no"
    env_file: .env
    environment:
      <<: *app-env
    command: flask --app wsgi db upgrade
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    # Published on loopback only, for host-side debugging (curl
    # 127.0.0.1:8000/health). Public traffic arrives through the central
    # caddy-proxy service on the external `proxy` network as deevalegh-api:8000.
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      <<: *app-env
    networks:
      default:
      proxy:
        aliases:
          - deevalegh-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build: .
    restart: unless-stopped
    command: celery -A app.celery_app worker --loglevel=info
    env_file: .env
    environment:
      <<: *app-env
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  beat:
    build: .
    restart: unless-stopped
    command: celery -A celery_beat_schedule beat --loglevel=info
    env_file: .env
    environment:
      <<: *app-env
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # NOTE: Ingress TLS is managed by the host's central `caddy-proxy` stack on
  # the external `proxy` network, routing to `deevalegh-api:8000` and
  # `deevalegh-minio:9000`.

volumes:
  pgdata:
  minio_data:

networks:
  default:
  proxy:
    external: true
