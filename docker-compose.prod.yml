name: deevalegh-prod

# Shared by every service built from this repo. Previously duplicated four
# times, which is how the copies drift.
x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/deevalegh
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  S3_ENDPOINT_URL: http://minio:9000
  FLASK_ENV: production

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: deevalegh
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set in .env}
    volumes:
      - minio_data:/data

  # Runs once per deploy and exits; everything that touches the database waits
  # for it to succeed. If a migration fails, the app never starts on a schema it
  # cannot use -- which is the failure mode you want.
  migrate:
    build: .
    restart: "no"
    env_file: .env
    environment:
      <<: *app-env
    command: flask --app wsgi db upgrade
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    # Published on loopback only, for host-side debugging (curl
    # 127.0.0.1:8000/health). Public traffic arrives through the caddy service,
    # which reaches this container as api:8000 over the compose network.
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build: .
    restart: unless-stopped
    command: celery -A app.celery_app worker --loglevel=info
    env_file: .env
    environment:
      <<: *app-env
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  beat:
    build: .
    restart: unless-stopped
    command: celery -A celery_beat_schedule beat --loglevel=info
    env_file: .env
    environment:
      <<: *app-env
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # TLS-terminating reverse proxy for the API. Provisions and renews a Let's
  # Encrypt certificate for API_DOMAIN automatically and forwards to the api
  # service; WebSocket upgrades (/socket.io/) pass through with no extra config.
  #
  # No depends_on: Caddy is independent infrastructure. It comes up, obtains its
  # cert (which needs only port 80 + DNS, not the app), and returns 502 until
  # api is reachable -- so a broken app never blocks the proxy or its cert.
  #
  # caddy_data MUST persist: it holds the certificates. Without it every deploy
  # re-requests them and quickly trips Let's Encrypt rate limits.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_DOMAIN: ${API_DOMAIN:?set in .env, e.g. api.deevalegh.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # NOTE: there is deliberately no `web` service here. The SPA is deployed to
  # Vercel and talks to this stack cross-origin at api.deevalegh.com, so the
  # nginx container that used to serve the bundle and proxy /api is redundant.
  # frontend/Dockerfile + frontend/nginx.conf are kept for the all-in-one
  # fallback (see DEPLOY.md) but are not built by this compose file.

volumes:
  pgdata:
  minio_data:
  caddy_data:
  caddy_config:
